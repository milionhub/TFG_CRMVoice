<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="452531787979-7sr2nuoai5efj895t2mph24ahuagp0ff.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Botón oficial de Google (google_sign_in_web 0.12.4+4, renderButton):
    el plugin mete el iframe de Google en <div id="sign_in_button_N"> con
    overflow:hidden y lo dimensiona al tamaño del botón (p. ej. 300x40), pero
    Google dibuja un iframe 20px más ancho y 4px más alto (margin: -2px -10px).
    El recorte cae justo sobre el borde del botón y lo corta a la derecha/abajo.
    Dejamos visible ese margen transparente (no se modifica el botón).
    Revisar si se actualiza google_sign_in_web.
  -->
  <style>
    div[id^="sign_in_button_"] {
      overflow: visible !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
