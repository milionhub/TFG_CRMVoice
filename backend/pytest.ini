[pytest]
# Solo se recogen tests de tests/ (nunca scripts manuales del backend)
testpaths = tests
# Los módulos del backend se importan como en producción (import main, import db...)
pythonpath = .
addopts = -ra --strict-markers
# Un xfail que empieza a pasar hace fallar la suite: obliga a revisar el test
xfail_strict = true
